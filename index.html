<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.C STUDIO 個人營養分析</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; min-height: 100vh; margin: 0; color: #333; }
    .card { background: white; width: 100%; max-width: 450px; padding: 30px; margin: 20px 0; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h2, h3 { color: #2c3e50; text-align: center; }
    
    .btn-option { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 10px; background: white; cursor: pointer; font-size: 16px; transition: 0.2s; text-align: left; }
    .btn-option:hover { border-color: #3498db; background: #ebf5fb; color: #2980b9; }
    
    .hidden { display: none !important; }
    
    /* 報告卡片樣式 */
    .report-box { border-left: 5px solid #3498db; background: #f8fafc; padding: 15px; margin-bottom: 20px; border-radius: 0 10px 10px 0; }
    .report-title { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
    .report-dosage { font-size: 13px; color: #e67e22; font-weight: bold; background: #fdf2e9; display: inline-block; padding: 3px 8px; border-radius: 5px; margin-bottom: 8px;}
    .report-desc { font-size: 14px; color: #555; line-height: 1.5; }
    
    #loading { text-align: center; color: #7f8c8d; margin-top: 50px; }
    .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>

  <div class="card">
    <h2>T.C STUDIO 專業營養分析</h2>
    
    <div id="loading">藥師系統連線中，請稍候...</div>

    <div id="quiz-container" class="hidden"></div>

    <div id="result-container" class="hidden">
      <p style="text-align: center; color: #7f8c8d; margin-bottom: 25px;">根據您的身體狀況，T.C STUDIO 藥師團隊建議您優先補充以下營養素：</p>
      <div id="ingredient-list"></div>
    </div>

    <div class="footer">Copyright© T.C STUDIO 藥局版權所有</div>
  </div>

  <script>
    let dbData = {}; 
    let userStats = {};  // 儲存積分，例如 { eye_fatigue: 3 }
    let userStatus = []; // 儲存禁忌標籤，例如 ['ban_pregnant', 'ban_surgery']

    // 1. 初始化：向後端請求資料
    window.onload = function() {
      google.script.run.withSuccessHandler(initQuiz).getQuizData();
    };

    function initQuiz(data) {
      dbData = data;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('quiz-container').classList.remove('hidden');
      renderQuestion(0); 
    }

    // 2. 渲染題目
    function renderQuestion(index) {
      const container = document.getElementById('quiz-container');
      container.innerHTML = ''; 

      // 檢查是否還有題目，沒有就進入結算
      if (index >= dbData.questions.length) {
        calculateReport();
        return;
      }

      const q = dbData.questions[index];
      
      const title = document.createElement('h3');
      title.innerText = q.title;
      container.appendChild(title);

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt.option;
        btn.onclick = () => handleAnswer(opt, index);
        container.appendChild(btn);
      });
    }

    // 3. 處理回答與跳題邏輯
    function handleAnswer(opt, currentIndex) {
      // 紀錄積分
      if (opt.score_tag && opt.score_tag !== '-') {
        if (!userStats[opt.score_tag]) userStats[opt.score_tag] = 0;
        userStats[opt.score_tag] += opt.score_val;
      }
      
      // 紀錄禁忌狀態 (如果有多個狀態用逗號分隔，程式會自動拆解)
      if (opt.set_status && opt.set_status !== '-') {
        const statuses = opt.set_status.split(',').map(s => s.trim());
        userStatus.push(...statuses);
      }

      // 處理跳題 (next_q)
      let nextIndex = currentIndex + 1; 
      if (opt.next_q && opt.next_q !== '-') {
        const jumpIndex = dbData.questions.findIndex(q => q.id === opt.next_q);
        if (jumpIndex !== -1) nextIndex = jumpIndex; 
      }

      renderQuestion(nextIndex);
    }

    // 4. 核心大腦：計算營養報告
    function calculateReport() {
      document.getElementById('quiz-container').classList.add('hidden');
      document.getElementById('result-container').classList.remove('hidden');
      
      let qualifiedIngredients = [];

      // 階段一：過濾禁忌與分數門檻
      dbData.ingredients.forEach(ing => {
        // A. 禁忌檢查
        let isBanned = false;
        if (ing.ban_status && ing.ban_status !== '-') {
          const bans = ing.ban_status.split(',').map(s => s.trim());
          // 只要使用者的狀態中了任何一個禁忌，就排除
          isBanned = bans.some(ban => userStatus.includes(ban));
        }
        if (isBanned) return; // 觸發禁忌，直接跳過此成分

        // B. 分數門檻檢查
        const userScore = userStats[ing.req_tag] || 0;
        if (userScore >= ing.min_score) {
          qualifiedIngredients.push(ing);
        }
      });

      // 階段二：處理同類互斥 (Priority 優先權爭奪戰)
      let finalSelection = {}; 
      
      qualifiedIngredients.forEach(ing => {
        const category = ing.category || ing.id; // 若無分類，則自成一類不互斥
        
        // 如果這個分類還沒入選任何成分，或是目前這個成分的 priority 更高，就替換掉
        if (!finalSelection[category] || ing.priority > finalSelection[category].priority) {
          finalSelection[category] = ing;
        }
      });

      // 階段三：渲染最終報告畫面
      renderReportUI(Object.values(finalSelection));
    }

    // 5. 繪製報告畫面
    function renderReportUI(finalList) {
      const listDiv = document.getElementById('ingredient-list');
      listDiv.innerHTML = '';

      if (finalList.length === 0) {
        listDiv.innerHTML = "<div class='report-box'><p style='text-align:center;'>您目前的狀況十分良好！保持均衡飲食與規律作息即可，無需額外大量補充特殊營養素。</p></div>";
        return;
      }

      // 將最後選出的成分畫成精緻卡片
      finalList.forEach(ing => {
        listDiv.innerHTML += `
          <div class="report-box">
            <div class="report-title">${ing.name}</div>
            ${ing.dosage ? `<div class="report-dosage">💡 建議：${ing.dosage}</div>` : ''}
            <div class="report-desc">${ing.desc}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
