<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mia 健康評估</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .card { background: white; width: 90%; max-width: 400px; padding: 35px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); text-align: center; box-sizing: border-box; }
        h2 { margin-top: 0; color: #0f172a; font-size: 22px; line-height: 1.4; }
        .subtitle { font-size: 14px; color: #64748b; margin-bottom: 25px; line-height: 1.5; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 5px; }
        input[type="text"], input[type="date"], input[type="number"] { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 12px; box-sizing: border-box; font-size: 16px; transition: border-color 0.2s; }
        input:focus { border-color: #06C755; outline: none; }
        
        .btn { display: block; width: 100%; padding: 16px; margin: 20px 0 0 0; background: #06C755; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn:active { background: #05a647; }
        
        /* 單選按鈕樣式 */
        .btn-option { margin: 10px 0; background: #f8fafc; color: #333; border: 2px solid #e2e8f0; }
        
        /* 複選框樣式 */
        .chk-group { text-align: left; margin-top: 20px; }
        .chk-label { display: block; padding: 15px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; }
        .chk-label:has(input:checked) { border-color: #06C755; background: #f0fdf4; color: #06C755; }
        .chk-label input { margin-right: 10px; transform: scale(1.2); }

        .spinner { margin: 20px auto; width: 35px; height: 35px; border: 4px solid #e2e8f0; border-top-color: #06C755; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .preview-badge { background: #f59e0b; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body>

    <div id="app" class="card" style="position: relative;">
        <div class="spinner"></div>
        <p class="subtitle" style="margin-top:15px;">系統連線中...</p>
    </div>

    <script>
        // ==========================================
        const LIFF_ID = "2009556106-H69vePZ7"; 
        // 🚨 請換成你最新部署的 GAS API 網址！
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz-0vA1TVD9cYaIyWF3sXugr3U45hNab2otMbc7gVpn0L3xw9Xmbr9d48zSkGXg2JFbbg/exec"; 
        // ==========================================

        let userData = { uid: '', name: '', birthday: '', height: '', weight: '', tags: [] };
        let qData = [];

        // 💡 抓取網址參數，檢查是否為預覽模式 (?preview=true)
        const urlParams = new URLSearchParams(window.location.search);
        const isPreview = urlParams.get('preview') === 'true';

        async function initApp() {
            try {
                // 💡 如果是預覽模式，直接跳過 LINE 授權，秒進表單！
                if (isPreview) {
                    userData.uid = "preview-" + Math.floor(Math.random() * 10000);
                    renderForm("測試員 (預覽模式)");
                    document.getElementById('app').innerHTML += '<div class="preview-badge">預覽模式</div>';
                    return;
                }

                // 正常 LINE 用戶流程
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    document.getElementById('app').innerHTML = '<div class="spinner"></div><p class="subtitle">讀取資料中...</p>';
                    const profile = await liff.getProfile();
                    userData.uid = profile.userId;
                    renderForm(profile.displayName);
                } else {
                    liff.login({ redirectUri: window.location.href });
                }
            } catch (err) {
                document.getElementById('app').innerHTML = `<h2>連線異常</h2><p class="subtitle">${err.message}</p>`;
            }
        }

        function renderForm(lineName) {
            document.getElementById('app').innerHTML = `
                ${isPreview ? '<div class="preview-badge">預覽模式</div>' : ''}
                <h2>建立健康檔案</h2>
                <p class="subtitle">嗨 ${lineName}，請確認基本資料</p>
                <div class="input-group"><label>真實姓名</label><input type="text" id="uiName" value="${lineName}"></div>
                <div class="input-group"><label>出生年月日</label><input type="date" id="uiBirth"></div>
                <div style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 1;"><label>身高 (cm)</label><input type="number" id="uiH"></div>
                    <div class="input-group" style="flex: 1;"><label>體重 (kg)</label><input type="number" id="uiW"></div>
                </div>
                <button class="btn" onclick="startQuiz()">下一步，開始測驗</button>
            `;
        }

        async function startQuiz() {
            userData.name = document.getElementById('uiName').value;
            userData.birthday = document.getElementById('uiBirth').value;
            userData.height = document.getElementById('uiH').value;
            userData.weight = document.getElementById('uiW').value;

            if(!userData.name || !userData.birthday || !userData.height || !userData.weight) return alert("請完整填寫所有資料唷！");

            document.getElementById('app').innerHTML = '<h2>題庫讀取中...</h2><div class="spinner"></div>';
            
            try {
                const response = await fetch(GAS_API_URL);
                const result = await response.json();
                if(result.status === 'success' && result.data.length > 0) {
                    qData = result.data;
                    renderQ(qData[0]['題號']); // 自動從第一題開始
                } else {
                    alert("目前沒有設定任何題目，請至後台設定。");
                }
            } catch (err) {
                alert("網路異常，無法取得題庫");
            }
        }

        // 💡 核心升級：動態渲染無限選項與複選題
        function renderQ(qId) {
            if(!qId || qId.toUpperCase() === 'RESULT') return finishQuiz();
            
            const q = qData.find(x => x['題號'] === qId);
            if(!q) return alert(`找不到題號：${qId}，請檢查後台設定。`);
            
            let html = `<h2>${q['題目內容']}</h2>`;
            const options = q['選項設定'] || [];

            if (q['題目類型'] === 'checkbox') {
                // ☑️ 複選題介面
                html += `<div class="chk-group">`;
                options.forEach((opt, idx) => {
                    html += `<label class="chk-label"><input type="checkbox" name="opt-chk" value="${idx}"> ${opt.text}</label>`;
                });
                html += `</div>`;
                html += `<button class="btn" onclick="submitCheckbox('${qId}')">確認並進入下一題</button>`;
            } else {
                // 🔘 單選題介面
                options.forEach(opt => {
                    html += `<button class="btn btn-option" onclick="ans('${opt.target}', '${opt.tag}')">${opt.text}</button>`;
                });
            }
            
            document.getElementById('app').innerHTML = html;
        }

        // 單選觸發
        function ans(nextQId, tag) {
            if(tag && tag !== '無') userData.tags.push(...tag.split(','));
            renderQ(nextQId);
        }

        // 複選觸發
        function submitCheckbox(qId) {
            const q = qData.find(x => x['題號'] === qId);
            const checkboxes = document.querySelectorAll('input[name="opt-chk"]:checked');
            
            if(checkboxes.length === 0) return alert("請至少勾選一個選項！");
            
            let nextQId = '';
            checkboxes.forEach(box => {
                const opt = q['選項設定'][box.value];
                if(opt.tag && opt.tag !== '無') userData.tags.push(...opt.tag.split(','));
                
                // 邏輯規則：複選題的「下一題」，會以「第一個被勾選」的選項的導向為主
                if(!nextQId) nextQId = opt.target; 
            });
            
            renderQ(nextQId);
        }

        async function finishQuiz() {
            document.getElementById('app').innerHTML = '<h2>產出報告中...</h2><p class="subtitle">正在安全儲存您的資料</p><div class="spinner"></div>';
            
            try {
                // 將資料存入雲端
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(userData)
                });

                const uniqueTags = [...new Set(userData.tags)];
                const resultText = uniqueTags.length > 0 ? uniqueTags.join('、') : '目前狀態良好，維持現狀即可。';

                document.getElementById('app').innerHTML = `
                    <h2>分析報告</h2>
                    <p class="subtitle">${userData.name} 您好，以下是專屬結果：</p>
                    <div style="background:#f1f5f9; padding:20px; border-radius:15px; text-align:left; border-left:5px solid #06C755; margin:20px 0;">
                        <b>💡 建議補充成分：</b><br><br><span style="color:#06C755; font-size:18px; font-weight:bold;">${resultText}</span>
                    </div>
                    <p style="font-size:11px; color:#94a3b8;">© T.C STUDIO</p>
                    <button class="btn" style="background:#1e293b;" onclick="location.reload()">重新測驗</button>
                `;
            } catch (err) {
                alert("資料存檔時發生錯誤");
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
